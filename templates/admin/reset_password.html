<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t["page_title_reset"] }}</title>
    <meta name="description" content="{{ t["page_desc_reset"] }}">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0B1A2A">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── Actuators Brand System ── */
        :root, :root[data-theme="dark"] {
            --bg-primary: #0B1A2A;
            --bg-surface: rgba(11, 26, 42, 0.8);
            --text-primary: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --structure-cyan: #00B7C2;
            --structure-cyan-muted: rgba(0, 183, 194, 0.3);
            --activation-orange: #FF6A2A;
            --font-primary-ar: 'IBM Plex Sans Arabic', sans-serif;
            --font-primary-en: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        :root[data-theme="light"] {
            --bg-primary: #F0F4F8;
            --bg-surface: rgba(255, 255, 255, 0.9);
            --text-primary: #0B1A2A;
            --text-muted: rgba(11, 26, 42, 0.55);
            --structure-cyan: #00919A;
            --structure-cyan-muted: rgba(0, 145, 154, 0.2);
            --activation-orange: #E55A1B;
        }

        .hidden { display: none !important; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [dir="rtl"] body { font-family: var(--font-primary-ar); }
        [dir="ltr"] body { font-family: var(--font-primary-en); }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--structure-cyan-muted) 1px, transparent 1px),
                linear-gradient(90deg, var(--structure-cyan-muted) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.15;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, var(--structure-cyan-muted) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: 30px 30px;
            opacity: 0.3;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-logo-wrap {
            position: relative; width: 80px; height: 80px; margin: 0 auto 16px;
            filter: drop-shadow(0 0 12px rgba(0,183,194,0.35)) drop-shadow(0 0 40px rgba(0,183,194,0.1));
            transition: filter 0.4s ease;
        }
        .auth-logo-wrap .al-default, .auth-logo-wrap .al-hover { position: absolute; inset: 0; transition: opacity 0.4s cubic-bezier(1,0,0,1); }
        .auth-logo-wrap .al-hover { opacity: 0; }
        .logo-section:hover .auth-logo-wrap .al-default { opacity: 0; }
        .logo-section:hover .auth-logo-wrap .al-hover { opacity: 1; }
        .logo-section:hover .auth-logo-wrap { filter: drop-shadow(0 0 16px rgba(255,106,42,0.4)) drop-shadow(0 0 50px rgba(255,106,42,0.12)); }
        .auth-wordmark-wrap { position: relative; width: 260px; height: 50px; margin: 0 auto 8px; }
        .auth-wordmark-wrap .aw-default, .auth-wordmark-wrap .aw-hover { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 0.4s cubic-bezier(1,0,0,1); }
        .auth-wordmark-wrap .aw-hover { opacity: 0; }
        .logo-section:hover .auth-wordmark-wrap .aw-default { opacity: 0; }
        .logo-section:hover .auth-wordmark-wrap .aw-hover { opacity: 1; }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--structure-cyan-muted);
            border-radius: 2px;
            padding: 32px;
        }

        .login-card h2 {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            inset-inline-start: 12px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px 10px 12px;
            padding-inline-start: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--structure-cyan-muted);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: var(--font-primary-ar);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s linear;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-input:focus {
            border-color: var(--structure-cyan);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-input {
            padding-inline-end: 40px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            inset-inline-end: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            width: 18px;
            height: 18px;
            transition: color 0.2s linear;
        }

        .toggle-password:hover {
            color: var(--structure-cyan);
        }

        .error-msg {
            display: none;
            background: rgba(255, 106, 42, 0.08);
            border: 1px solid rgba(255, 106, 42, 0.3);
            border-radius: 2px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            color: var(--activation-orange);
        }

        .error-msg.visible {
            display: block;
        }

        .error-msg.shake {
            animation: shake 0.4s linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        .success-msg {
            display: none;
            background: rgba(0, 183, 194, 0.08);
            border: 1px solid rgba(0, 183, 194, 0.3);
            border-radius: 2px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            color: var(--structure-cyan);
        }

        .success-msg.visible {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--activation-orange);
            color: var(--bg-primary);
            font-family: var(--font-primary-ar);
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s linear;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(11, 26, 42, 0.3);
            border-top-color: var(--bg-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .spinner.visible {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .structure-line {
            width: 100%;
            height: 1px;
            background: var(--structure-cyan-muted);
            margin: 24px 0;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .login-links {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 16px;
        }

        .login-links a {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s linear;
            font-family: var(--font-primary-ar);
        }

        .login-links a:hover {
            color: var(--structure-cyan);
        }

        .assemble {
            opacity: 0;
            transform: translateY(8px);
            animation: assemble 0.3s linear forwards;
        }

        .assemble-1 { animation-delay: 0.05s; }
        .assemble-2 { animation-delay: 0.1s; }
        .assemble-3 { animation-delay: 0.15s; }

        @keyframes assemble {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .corner-marks {
            position: absolute;
            inset: -1px;
            pointer-events: none;
        }

        .corner-marks::before,
        .corner-marks::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--structure-cyan);
            border-style: solid;
        }

        .corner-marks::before {
            top: 0;
            inset-inline-start: 0;
            border-width: 0;
            border-block-start-width: 1px;
            border-inline-start-width: 1px;
        }

        .corner-marks::after {
            bottom: 0;
            inset-inline-end: 0;
            border-width: 0;
            border-block-end-width: 1px;
            border-inline-end-width: 1px;
        }

        .corner-marks-alt::before {
            top: 0;
            inset-inline-end: 0;
            inset-inline-start: auto;
            border-width: 0;
            border-block-start-width: 1px;
            border-inline-end-width: 1px;
        }

        .corner-marks-alt::after {
            bottom: 0;
            inset-inline-start: 0;
            inset-inline-end: auto;
            border-width: 0;
            border-block-end-width: 1px;
            border-inline-start-width: 1px;
        }
    </style>
</head>

<body>
    <!-- Unified Controls: Language + Theme -->
    <div style="position:fixed;top:16px;inset-inline-end:16px;z-index:10;display:flex;align-items:center;gap:0;border:1px solid var(--structure-cyan-muted);background:var(--bg-surface);">
        <a href="?lang={% if lang == "ar" %}en{% else %}ar{% endif %}"
           style="display:flex;align-items:center;gap:6px;padding:6px 12px;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;text-decoration:none;letter-spacing:0.1em;transition:all 0.15s linear;border-inline-end:1px solid var(--structure-cyan-muted);"
           onmouseover="this.style.color='var(--structure-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
            {% if lang == "ar" %}EN{% else %}عربي{% endif %}
        </a>
        <button onclick="toggleThemeAuth()" style="display:flex;align-items:center;padding:6px 10px;background:none;border:none;color:var(--text-muted);cursor:pointer;transition:all 0.15s linear;"
                onmouseover="this.style.color='var(--structure-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
            <svg id="auth-sun" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg id="auth-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>
    <script>
    function toggleThemeAuth(){
        const html=document.documentElement;
        const isDark=html.getAttribute('data-theme')==='dark';
        html.setAttribute('data-theme',isDark?'light':'dark');
        localStorage.setItem('theme',isDark?'light':'dark');
        updateThemeIcons();
    }
    function updateThemeIcons(){
        const isDark=document.documentElement.getAttribute('data-theme')==='dark';
        const sun=document.getElementById('auth-sun');
        const moon=document.getElementById('auth-moon');
        if(sun&&moon){sun.classList.toggle('hidden',isDark);moon.classList.toggle('hidden',!isDark);}
    }
    (function(){
        const t=localStorage.getItem('theme')||'dark';
        document.documentElement.setAttribute('data-theme',t);
        setTimeout(updateThemeIcons,0);
    })();
    </script>

    <div class="login-container">
        <!-- Logo -->
        <div class="logo-section assemble assemble-1">
            <a href="/?lang={{ lang }}" style="text-decoration:none;display:inline-flex;flex-direction:column;align-items:center;">
                <div class="auth-logo-wrap">
                    <svg class="al-default" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="80" height="80"><defs><g id="ald"><polygon points="0,-20 17.3205,-10 17.3205,10 0,20 -17.3205,10 -17.3205,-10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="20" stroke="currentColor" stroke-width="1.5"/><line x1="0" y1="0" x2="-17.3205" y2="-10" stroke="currentColor" stroke-width="1.5"/><line x1="0" y1="0" x2="17.3205" y2="-10" stroke="currentColor" stroke-width="1.5"/></g></defs><g transform="translate(60,60)"><use href="#ald" x="34.641" y="0" color="#00B7C2"/><use href="#ald" x="-34.641" y="0" color="#00B7C2"/><use href="#ald" x="17.3205" y="-30" color="#00B7C2"/><use href="#ald" x="-17.3205" y="-30" color="#00B7C2"/><use href="#ald" x="17.3205" y="30" color="#00B7C2"/><use href="#ald" x="-17.3205" y="30" color="#00B7C2"/><use href="#ald" x="0" y="0" color="#FF6A2A"/></g></svg>
                    <svg class="al-hover" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="80" height="80"><defs><g id="alr"><polygon points="0,-20 17.3205,-10 17.3205,10 0,20 -17.3205,10 -17.3205,-10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="20" stroke="currentColor" stroke-width="1.5"/><line x1="0" y1="0" x2="-17.3205" y2="-10" stroke="currentColor" stroke-width="1.5"/><line x1="0" y1="0" x2="17.3205" y2="-10" stroke="currentColor" stroke-width="1.5"/></g></defs><g transform="translate(60,60)"><use href="#alr" x="34.641" y="0" color="#FF6A2A"/><use href="#alr" x="-34.641" y="0" color="#FF6A2A"/><use href="#alr" x="17.3205" y="-30" color="#FF6A2A"/><use href="#alr" x="-17.3205" y="-30" color="#FF6A2A"/><use href="#alr" x="17.3205" y="30" color="#FF6A2A"/><use href="#alr" x="-17.3205" y="30" color="#FF6A2A"/><use href="#alr" x="0" y="0" color="#00B7C2"/></g></svg>
                </div>
                <div class="auth-wordmark-wrap">
                    <svg class="aw-default" xmlns="http://www.w3.org/2000/svg" viewBox="40 100 920 145"><line x1="40" y1="120" x2="960" y2="120" stroke="#FF6A2A" stroke-width="2" opacity="0.5"/><line x1="40" y1="180" x2="960" y2="180" stroke="#FF6A2A" stroke-width="2" opacity="0.5"/><line x1="40" y1="230" x2="960" y2="230" stroke="#FF6A2A" stroke-width="2" opacity="0.5"/><path d="M 60 70 v240 M 150 90 v50 M 260 230 v50 M 340 90 v160 M 480 230 v50 M 640 100 v30 M 750 230 v50 M 880 100 v160 M 940 70 v240" stroke="#FF6A2A" stroke-width="2" opacity="0.3" fill="none"/><text x="500" y="230" font-family="Inter, sans-serif" font-size="140" font-weight="600" fill="#00B7C2" letter-spacing="7" text-anchor="middle">ACTUATORS</text></svg>
                    <svg class="aw-hover" xmlns="http://www.w3.org/2000/svg" viewBox="40 100 920 145"><line x1="40" y1="120" x2="960" y2="120" stroke="#00B7C2" stroke-width="2" opacity="0.5"/><line x1="40" y1="180" x2="960" y2="180" stroke="#00B7C2" stroke-width="2" opacity="0.5"/><line x1="40" y1="230" x2="960" y2="230" stroke="#00B7C2" stroke-width="2" opacity="0.5"/><path d="M 60 70 v240 M 150 90 v50 M 260 230 v50 M 340 90 v160 M 480 230 v50 M 640 100 v30 M 750 230 v50 M 880 100 v160 M 940 70 v240" stroke="#00B7C2" stroke-width="2" opacity="0.3" fill="none"/><text x="500" y="230" font-family="Inter, sans-serif" font-size="140" font-weight="600" fill="#FF6A2A" letter-spacing="7" text-anchor="middle">ACTUATORS</text></svg>
                </div>
            </a>
            <div class="brand-sub">{{ t["auto_login_308"] }}</div>
        </div>

        <!-- Reset Password Card -->
        <div class="login-card assemble assemble-2" style="position: relative;">
            <div class="corner-marks"></div>
            <div class="corner-marks corner-marks-alt"></div>

            <h2>{{ t["reset_title"] }}</h2>

            <!-- Error -->
            <div id="reset-error" class="error-msg"></div>

            <!-- Success -->
            <div id="reset-success" class="success-msg"></div>

            <form id="reset-form"
                data-success="{{ t["reset_success_msg"] }}"
                data-mismatch="{{ t["reset_error_mismatch"] }}"
                data-short="{{ t["reset_error_short"] }}"
                data-error="{{ t["reset_error_connection"] }}"
                data-invalid="{{ t["reset_error_invalid_token"] }}">
                <!-- New Password -->
                <div class="form-group">
                    <label class="form-label">{{ t["reset_new_password"] }}</label>
                    <div class="input-wrapper password-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>

                        <button type="button" onclick="togglePassword('password')" class="toggle-password" aria-label="Toggle password">
                            <svg class="eye-closed" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"

                            </svg>
                            <svg class="eye-open" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"

                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label class="form-label">{{ t["reset_confirm_password"] }}</label>
                    <div class="input-wrapper password-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"

                        </svg>
                        <input type="password" id="confirm-password" name="confirm_password" required

                        <button type="button" onclick="togglePassword('confirm-password')" class="toggle-password" aria-label="Toggle password">
                            <svg class="eye-closed" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>

                            <svg class="eye-open" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"

                <div class="structure-line"></div>

                <!-- Submit -->
                <button type="submit" id="reset-btn" class="btn-submit"
                    data-processing="{{ t["reset_btn_processing"] }}"
                    data-done="{{ t["reset_btn_done"] }}"
                    data-submit="{{ t["reset_btn_submit"] }}">
                    <span id="btn-text">{{ t["reset_btn_submit"] }}</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>

                <!-- Login Link -->
                <div class="login-links">
                    <a href="/admin/login?lang={{ lang }}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline;vertical-align:middle;margin-inline-end:4px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        {{ t["forgot_back_login"] }}
                    </a>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="login-footer assemble assemble-3">
            &copy; 2026 Actuators L.L.C
        </div>
    </div>

    <script>
        var resetToken = '{{ token }}';

        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const wrapper = input.closest('.password-wrapper');
            const eyeClosed = wrapper.querySelector('.eye-closed');
            const eyeOpen = wrapper.querySelector('.eye-open');
            if (input.type === 'password') {
                input.type = 'text';
                eyeClosed.style.display = 'none';
                eyeOpen.style.display = 'block';
            } else {
                input.type = 'password';
                eyeClosed.style.display = 'block';
                eyeOpen.style.display = 'none';
            }
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = document.getElementById('reset-form');
            const btn = document.getElementById('reset-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const errorDiv = document.getElementById('reset-error');
            const successDiv = document.getElementById('reset-success');

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Client-side validation
            if (password.length < 8) {
                errorDiv.textContent = form.dataset.short;
                errorDiv.classList.add('visible');
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 400);
                return;
            }

            if (password !== confirmPassword) {
                errorDiv.textContent = form.dataset.mismatch;
                errorDiv.classList.add('visible');
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 400);
                return;
            }

            btn.disabled = true;
            btnText.textContent = btn.dataset.processing;
            spinner.classList.add('visible');
            errorDiv.classList.remove('visible');
            successDiv.classList.remove('visible');

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, new_password: password }),
                });

                const data = await res.json();

                if (res.ok) {
                    successDiv.textContent = form.dataset.success;
                    successDiv.classList.add('visible');
                    btnText.textContent = btn.dataset.done;
                    spinner.classList.remove('visible');

                    setTimeout(() => {
                        window.location.href = '/admin/login?lang={{ lang }}';
                    }, 3000);
                } else {
                    throw new Error(data.error || form.dataset.invalid);
                }
            } catch (err) {
                errorDiv.textContent = err.message || form.dataset.error;
                errorDiv.classList.add('visible');
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 400);

                btn.disabled = false;
                btnText.textContent = btn.dataset.submit;
                spinner.classList.remove('visible');
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t["page_title_org_register"] }}</title>
    <meta name="description" content="Actuators — Organization Registration Request">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0B1A2A">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── Actuators Brand System ── */
        :root, :root[data-theme="dark"] {
            --bg-primary: #0B1A2A;
            --bg-surface: rgba(11, 26, 42, 0.8);
            --text-primary: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --structure-cyan: #00B7C2;
            --structure-cyan-muted: rgba(0, 183, 194, 0.3);
            --activation-orange: #FF6A2A;
            --success-green: #22C55E;
            --font-primary-ar: 'IBM Plex Sans Arabic', sans-serif;
            --font-primary-en: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        :root[data-theme="light"] {
            --bg-primary: #F0F4F8;
            --bg-surface: rgba(255, 255, 255, 0.9);
            --text-primary: #0B1A2A;
            --text-muted: rgba(11, 26, 42, 0.55);
            --structure-cyan: #00919A;
            --structure-cyan-muted: rgba(0, 145, 154, 0.2);
            --activation-orange: #E55A1B;
        }

        .hidden { display: none !important; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [dir="rtl"] body { font-family: var(--font-primary-ar); }
        [dir="ltr"] body { font-family: var(--font-primary-en); }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 32px 0;
        }

        /* ── Isometric Grid Background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--structure-cyan-muted) 1px, transparent 1px),
                linear-gradient(90deg, var(--structure-cyan-muted) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.15;
            pointer-events: none;
        }

        /* ── Node Map Decoration ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle, var(--structure-cyan-muted) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: 30px 30px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* ── Main Container ── */
        .register-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 16px;
        }

        /* ── Logo Section ── */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-logo-wrap {
            position: relative; width: 80px; height: 80px; margin: 0 auto 16px;
            filter: drop-shadow(0 0 12px rgba(0,183,194,0.35)) drop-shadow(0 0 40px rgba(0,183,194,0.1));
            transition: filter 0.4s ease;
        }
        .auth-logo-wrap .al-default, .auth-logo-wrap .al-hover { position: absolute; inset: 0; transition: opacity 0.4s cubic-bezier(1,0,0,1); }
        .auth-logo-wrap .al-hover { opacity: 0; }
        .logo-section:hover .auth-logo-wrap .al-default { opacity: 0; }
        .logo-section:hover .auth-logo-wrap .al-hover { opacity: 1; }
        .logo-section:hover .auth-logo-wrap { filter: drop-shadow(0 0 16px rgba(255,106,42,0.4)) drop-shadow(0 0 50px rgba(255,106,42,0.12)); }
        .auth-wordmark-wrap { position: relative; width: 260px; height: 50px; margin: 0 auto 8px; }
        .auth-wordmark-wrap .aw-default, .auth-wordmark-wrap .aw-hover { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 0.4s cubic-bezier(1,0,0,1); }
        .auth-wordmark-wrap .aw-hover { opacity: 0; }
        .logo-section:hover .auth-wordmark-wrap .aw-default { opacity: 0; }
        .logo-section:hover .auth-wordmark-wrap .aw-hover { opacity: 1; }

        /* ── Card ── */
        .register-card {
            background: var(--bg-surface);
            border: 1px solid var(--structure-cyan-muted);
            border-radius: 2px;
            padding: 32px;
        }

        .register-card h2 {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .register-card .subtitle {
            font-size: 13px;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* ── Form Elements ── */
        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-label .required {
            color: var(--activation-orange);
            margin-inline-start: 2px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            inset-inline-start: 12px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            padding-inline-start: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--structure-cyan-muted);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: var(--font-primary-ar);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s linear;
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--structure-cyan);
        }

        .form-select {
            appearance: none;
            cursor: pointer;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .no-icon {
            padding-inline-start: 12px;
        }

        /* ── Error / Success Messages ── */
        .msg-box {
            display: none;
            border-radius: 2px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }

        .msg-box.visible {
            display: block;
        }

        .msg-box.error {
            background: rgba(255, 106, 42, 0.08);
            border: 1px solid rgba(255, 106, 42, 0.3);
            color: var(--activation-orange);
        }

        .msg-box.success {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success-green);
        }

        .msg-box.shake {
            animation: shake 0.4s linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        /* ── Submit Button ── */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--activation-orange);
            color: var(--bg-primary);
            font-family: var(--font-primary-ar);
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s linear;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(11, 26, 42, 0.3);
            border-top-color: var(--bg-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .spinner.visible {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Structural Decoration Lines ── */
        .structure-line {
            width: 100%;
            height: 1px;
            background: var(--structure-cyan-muted);
            margin: 24px 0;
        }

        /* ── Footer ── */
        .register-footer {
            text-align: center;
            margin-top: 24px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* ── Links Section ── */
        .register-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .register-links a {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s linear;
            font-family: var(--font-primary-ar);
        }

        .register-links a:hover {
            color: var(--structure-cyan);
        }

        /* ── Sequential Assembly Animation ── */
        .assemble {
            opacity: 0;
            transform: translateY(8px);
            animation: assemble 0.3s linear forwards;
        }

        .assemble-1 { animation-delay: 0.05s; }
        .assemble-2 { animation-delay: 0.1s; }
        .assemble-3 { animation-delay: 0.15s; }

        @keyframes assemble {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Corner Markers ── */
        .corner-marks {
            position: absolute;
            inset: -1px;
            pointer-events: none;
        }

        .corner-marks::before,
        .corner-marks::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--structure-cyan);
            border-style: solid;
        }

        .corner-marks::before {
            top: 0;
            inset-inline-start: 0;
            border-width: 0;
            border-block-start-width: 1px;
            border-inline-start-width: 1px;
        }

        .corner-marks::after {
            bottom: 0;
            inset-inline-end: 0;
            border-width: 0;
            border-block-end-width: 1px;
            border-inline-end-width: 1px;
        }

        .corner-marks-alt::before {
            top: 0;
            inset-inline-end: 0;
            inset-inline-start: auto;
            border-width: 0;
            border-block-start-width: 1px;
            border-inline-end-width: 1px;
        }

        .corner-marks-alt::after {
            bottom: 0;
            inset-inline-start: 0;
            inset-inline-end: auto;
            border-width: 0;
            border-block-end-width: 1px;
            border-inline-start-width: 1px;
        }

        @media (max-width: 540px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Unified Controls: Language + Theme -->
    <div style="position:fixed;top:16px;inset-inline-end:16px;z-index:10;display:flex;align-items:center;gap:0;border:1px solid var(--structure-cyan-muted);background:var(--bg-surface);">
        <a href="?lang={% if lang == "ar" %}en{% else %}ar{% endif %}"
           style="display:flex;align-items:center;gap:6px;padding:6px 12px;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;text-decoration:none;letter-spacing:0.1em;transition:all 0.15s linear;border-inline-end:1px solid var(--structure-cyan-muted);"
           onmouseover="this.style.color='var(--structure-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
            {% if lang == "ar" %}EN{% else %}عربي{% endif %}
        </a>
        <button onclick="toggleThemeAuth()" style="display:flex;align-items:center;padding:6px 10px;background:none;border:none;color:var(--text-muted);cursor:pointer;transition:all 0.15s linear;"
                onmouseover="this.style.color='var(--structure-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
            <svg id="auth-sun" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg id="auth-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>
    <script>
    function toggleThemeAuth(){
        const html=document.documentElement;
        const isDark=html.getAttribute('data-theme')==='dark';
        html.setAttribute('data-theme',isDark?'light':'dark');
        localStorage.setItem('theme',isDark?'light':'dark');
        updateThemeIcons();
    }
    function updateThemeIcons(){
        const isDark=document.documentElement.getAttribute('data-theme')==='dark';
        const sun=document.getElementById('auth-sun');
        const moon=document.getElementById('auth-moon');
        if(sun&&moon){sun.classList.toggle('hidden',isDark);moon.classList.toggle('hidden',!isDark);}
    }
    (function(){
        const t=localStorage.getItem('theme')||'dark';
        document.documentElement.setAttribute('data-theme',t);
        setTimeout(updateThemeIcons,0);
    })();
    </script>

                <div class="auth-logo-wrap">

                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                            </svg>
                            <input type="tel" id="contact-phone" name="contact_phone"
                                placeholder="+966 5x xxx xxxx" class="form-input">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <!-- City -->
                    <div class="form-group">
                        <label class="form-label">{{ t["org_reg_country"] }}</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                            <input type="text" id="city" name="city"
                                placeholder="{{ t["org_reg_country_ph"] }}" class="form-input">
                        </div>
                    </div>

                    <!-- Website -->
                    <div class="form-group">
                        <label class="form-label">{{ t["org_reg_website"] }}</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                            </svg>
                            <input type="url" id="website" name="website"
                                placeholder="https://example.com" class="form-input">
                        </div>
                    </div>
                </div>

                <!-- Team Size -->
                <div class="form-group">
                    <label class="form-label">{{ t["org_reg_team_size"] }}</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                        <input type="number" id="team-size" name="team_size" min="1"
                            placeholder="10" class="form-input">
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label">{{ t["org_reg_description"] }}</label>
                    <textarea id="description" name="description" rows="3"
                        placeholder="{{ t["org_reg_description_ph"] }}"
                        class="form-textarea no-icon"></textarea>
                </div>

                <div class="structure-line"></div>

                <!-- Submit -->
                <button type="submit" id="submit-btn" class="btn-submit">
                    <span id="btn-text">{{ t["org_reg_submit"] }}</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>

                <!-- Links -->
                <div class="register-links">
                    <span>{{ t["org_reg_have_account"] }}</span>
                    <a href="/admin/login?lang={{ lang }}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline;vertical-align:middle;margin-inline-end:4px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                        </svg>
                        {{ t["org_reg_login_link"] }}
                    </a>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="register-footer assemble assemble-3">
            &copy; 2026 Actuators L.L.C
        </div>
    </div>

    <script>
        document.getElementById('org-register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = document.getElementById('org-register-form');
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const msgBox = document.getElementById('msg-box');

            btn.disabled = true;
            btnText.textContent = form.dataset.sending;
            spinner.classList.add('visible');
            msgBox.classList.remove('visible', 'error', 'success');

            const payload = {
                name: document.getElementById('org-name').value.trim(),
                org_type: document.getElementById('org-type').value,
                contact_email: document.getElementById('contact-email').value.trim(),
                contact_phone: document.getElementById('contact-phone').value.trim(),
                city: document.getElementById('city').value.trim(),
                website: document.getElementById('website').value.trim(),
                description: document.getElementById('description').value.trim(),
                team_size: parseInt(document.getElementById('team-size').value) || 0,
            };

            try {
                const res = await fetch('/api/auth/org-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload),
                });

                const data = await res.json();

                if (res.ok) {
                    msgBox.textContent = data.message || form.dataset.success;
                    msgBox.classList.add('visible', 'success');
                    btnText.textContent = form.dataset.sent;
                    spinner.classList.remove('visible');
                    form.reset();
                } else {
                    throw new Error(data.error || form.dataset.error);
                }
            } catch (err) {
                msgBox.textContent = err.message || form.dataset.connectionError;
                msgBox.classList.add('visible', 'error', 'shake');
                setTimeout(() => msgBox.classList.remove('shake'), 400);

                btn.disabled = false;
                btnText.textContent = form.dataset.submit;
                spinner.classList.remove('visible');
            }
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t["page_title_login"] }}</title>
    <meta name="description" content="Actuators — {{ t["login_title"] }}">
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0B1A2A">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ── Actuators Brand System ── */
        :root, :root[data-theme="dark"] {
            --bg-primary: #0B1A2A;
            --bg-surface: rgba(11, 26, 42, 0.8);
            --text-primary: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --structure-cyan: #00B7C2;
            --structure-cyan-muted: rgba(0, 183, 194, 0.3);
            --activation-orange: #FF6A2A;
            --font-primary-ar: 'IBM Plex Sans Arabic', sans-serif;
            --font-primary-en: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        :root[data-theme="light"] {
            --bg-primary: #F0F4F8;
            --bg-surface: rgba(255, 255, 255, 0.9);
            --text-primary: #0B1A2A;
            --text-muted: rgba(11, 26, 42, 0.55);
            --structure-cyan: #00919A;
            --structure-cyan-muted: rgba(0, 145, 154, 0.2);
            --activation-orange: #E55A1B;
        }

        .hidden { display: none !important; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── Direction-based font switching ── */
        [dir="rtl"] body {
            font-family: var(--font-primary-ar);
        }

        [dir="ltr"] body {
            font-family: var(--font-primary-en);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ── Isometric Grid Background ── */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--structure-cyan-muted) 1px, transparent 1px),
                linear-gradient(90deg, var(--structure-cyan-muted) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.15;
            pointer-events: none;
        }

        /* ── Node Map Decoration ── */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, var(--structure-cyan-muted) 1px, transparent 1px);
            background-size: 60px 60px;
            background-position: 30px 30px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* ── Main Container ── */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 16px;
        }

        /* ── Logo Section ── */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section a {
            text-decoration: none;
            color: inherit;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-name {
            font-family: var(--font-primary-en);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Hex Logo with glow + hover swap */
        .auth-logo-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            filter: drop-shadow(0 0 12px rgba(0,183,194,0.35)) drop-shadow(0 0 40px rgba(0,183,194,0.1));
            transition: filter 0.4s ease;
        }
        .auth-logo-wrap .al-default,
        .auth-logo-wrap .al-hover {
            position: absolute;
            inset: 0;
            transition: opacity 0.4s cubic-bezier(1,0,0,1);
        }
        .auth-logo-wrap .al-hover { opacity: 0; }
        .logo-section:hover .auth-logo-wrap .al-default { opacity: 0; }
        .logo-section:hover .auth-logo-wrap .al-hover   { opacity: 1; }
        .logo-section:hover .auth-logo-wrap {
            filter: drop-shadow(0 0 16px rgba(255,106,42,0.4)) drop-shadow(0 0 50px rgba(255,106,42,0.12));
        }

        .auth-wordmark-wrap {
            position: relative;
            width: 260px;
            height: 50px;
            margin: 0 auto 8px;
        }
        .auth-wordmark-wrap .aw-default,
        .auth-wordmark-wrap .aw-hover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s cubic-bezier(1,0,0,1);
        }
        .auth-wordmark-wrap .aw-hover { opacity: 0; }
        .logo-section:hover .auth-wordmark-wrap .aw-default { opacity: 0; }
        .logo-section:hover .auth-wordmark-wrap .aw-hover   { opacity: 1; }

        /* ── Login Card ── */
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--structure-cyan-muted);
            border-radius: 2px;
            padding: 32px;
        }

        .login-card h2 {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .login-card .login-subtitle {
            font-size: 13px;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* ── Form Elements ── */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            inset-inline-start: 12px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px 10px 12px;
            padding-inline-start: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--structure-cyan-muted);
            border-radius: 2px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s linear;
        }

        [dir="rtl"] .form-input {
            font-family: var(--font-primary-ar);
        }

        [dir="ltr"] .form-input {
            font-family: var(--font-primary-en);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-input:focus {
            border-color: var(--structure-cyan);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-input {
            padding-inline-end: 40px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            inset-inline-end: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            width: 18px;
            height: 18px;
            transition: color 0.2s linear;
        }

        .toggle-password:hover {
            color: var(--structure-cyan);
        }

        /* ── Error Message ── */
        .error-msg {
            display: none;
            background: rgba(255, 106, 42, 0.08);
            border: 1px solid rgba(255, 106, 42, 0.3);
            border-radius: 2px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            color: var(--activation-orange);
        }

        .error-msg.visible {
            display: block;
        }

        .error-msg.shake {
            animation: shake 0.4s linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-4px); }
        }

        /* ── Submit Button ── */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--activation-orange);
            color: var(--bg-primary);
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s linear;
        }

        [dir="rtl"] .btn-submit {
            font-family: var(--font-primary-ar);
        }

        [dir="ltr"] .btn-submit {
            font-family: var(--font-primary-en);
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(11, 26, 42, 0.3);
            border-top-color: var(--bg-primary);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .spinner.visible {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Structural Decoration Lines ── */
        .structure-line {
            width: 100%;
            height: 1px;
            background: var(--structure-cyan-muted);
            margin: 24px 0;
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* ── Links Section ── */
        .login-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
        }

        .login-links a {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s linear;
        }

        [dir="rtl"] .login-links a {
            font-family: var(--font-primary-ar);
        }

        [dir="ltr"] .login-links a {
            font-family: var(--font-primary-en);
        }

        .login-links a:hover {
            color: var(--structure-cyan);
        }

        /* ── Sequential Assembly Animation ── */
        .assemble {
            opacity: 0;
            transform: translateY(8px);
            animation: assemble 0.3s linear forwards;
        }

        .assemble-1 { animation-delay: 0.05s; }
        .assemble-2 { animation-delay: 0.1s; }
        .assemble-3 { animation-delay: 0.15s; }

        @keyframes assemble {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Activation Pulse on Logo Center Cube ── */
        .logo-pulse .cube-center {
            animation: pulse 3s linear infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Corner Markers ── */
        .corner-marks {
            position: absolute;
            inset: -1px;
            pointer-events: none;
        }

        .corner-marks::before,
        .corner-marks::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--structure-cyan);
            border-style: solid;
        }

        .corner-marks::before {
            top: 0;
            inset-inline-start: 0;
            border-width: 0;
            border-block-start-width: 1px;
            border-inline-start-width: 1px;
        }

        .corner-marks::after {
            bottom: 0;
            inset-inline-end: 0;
            border-width: 0;
            border-block-end-width: 1px;
            border-inline-end-width: 1px;
        }

        .corner-marks-alt::before {
            top: 0;
            inset-inline-end: 0;
            inset-inline-start: auto;
            border-width: 0;
            border-block-start-width: 1px;
            border-inline-end-width: 1px;
        }

        .corner-marks-alt::after {
            bottom: 0;
            inset-inline-start: 0;
            inset-inline-end: auto;
            border-width: 0;
            border-block-end-width: 1px;
            border-inline-start-width: 1px;
        }
    </style>
</head>

<body>
    <!-- Unified Controls: Language + Theme -->
    <div style="position:fixed;top:16px;inset-inline-end:16px;z-index:10;display:flex;align-items:center;gap:0;border:1px solid var(--structure-cyan-muted);background:var(--bg-surface);">
        <a href="?lang={% if lang == "ar" %}en{% else %}ar{% endif %}"
           style="display:flex;align-items:center;gap:6px;padding:6px 12px;color:var(--text-muted);font-family:var(--font-mono);font-size:11px;text-decoration:none;letter-spacing:0.1em;transition:all 0.15s linear;border-inline-end:1px solid var(--structure-cyan-muted);"
           onmouseover="this.style.color='var(--structure-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
            {% if lang == "ar" %}EN{% else %}عربي{% endif %}
        </a>
        <button onclick="toggleThemeAuth()" style="display:flex;align-items:center;padding:6px 10px;background:none;border:none;color:var(--text-muted);cursor:pointer;transition:all 0.15s linear;"
                onmouseover="this.style.color='var(--structure-cyan)'" onmouseout="this.style.color='var(--text-muted)'">
            <svg id="auth-sun" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg id="auth-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>
    <script>
    function toggleThemeAuth(){
        const html=document.documentElement;
        const isDark=html.getAttribute('data-theme')==='dark';
        html.setAttribute('data-theme',isDark?'light':'dark');
        localStorage.setItem('theme',isDark?'light':'dark');
        updateThemeIcons();
    }
    function updateThemeIcons(){
        const isDark=document.documentElement.getAttribute('data-theme')==='dark';
        const sun=document.getElementById('auth-sun');
        const moon=document.getElementById('auth-moon');
        if(sun&&moon){sun.classList.toggle('hidden',isDark);moon.classList.toggle('hidden',!isDark);}
    }
    (function(){
        const t=localStorage.getItem('theme')||'dark';
        document.documentElement.setAttribute('data-theme',t);
        setTimeout(updateThemeIcons,0);
    })();
    </script>

                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="structure-line"></div>

                <!-- Submit -->
                <button type="submit" id="login-btn" class="btn-submit">
                    <span id="btn-text">{{ t["login_btn"] }}</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>

                <!-- Forgot Password & Register Links -->
                <div class="login-links">
                    <a href="/forgot-password?lang={{ lang }}">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:inline;vertical-align:middle;margin-inline-end:4px;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                        {{ t["forgot_password"] }}
                    </a>
                    <a href="/admin/register?lang={{ lang }}">
                        {{ t["create_account"] }}
                    </a>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="login-footer assemble assemble-3">
            &copy; 2026 Actuators L.L.C
        </div>
    </div>

    <script>
        // Translation strings passed from template
        const LANG = '{{ lang }}';
        const T_LOADING = '{{ t["login_loading"] }}';
        const T_SUCCESS = '{{ t["login_success"] }}';
        const T_ERROR = '{{ t["login_error"] }}';
        const T_SERVER_ERROR = '{{ t["server_error"] }}';
        const T_BTN = '{{ t["login_btn"] }}';

        function togglePassword() {
            const input = document.getElementById('password');
            const eyeClosed = document.getElementById('eye-closed');
            const eyeOpen = document.getElementById('eye-open');
            if (input.type === 'password') {
                input.type = 'text';
                eyeClosed.style.display = 'none';
                eyeOpen.style.display = 'block';
            } else {
                input.type = 'password';
                eyeClosed.style.display = 'block';
                eyeOpen.style.display = 'none';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const errorDiv = document.getElementById('login-error');

            btn.disabled = true;
            btnText.textContent = T_LOADING;
            spinner.classList.add('visible');
            errorDiv.classList.remove('visible');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    document.cookie = `auth_token=${data.token};path=/;max-age=${60 * 60 * 24};SameSite=Strict`;

                    btnText.textContent = T_SUCCESS;
                    spinner.classList.remove('visible');

                    setTimeout(() => {
                        const params = new URLSearchParams(window.location.search);
                        const redirect = params.get('redirect') || '/admin';
                        window.location.href = redirect;
                    }, 400);
                } else {
                    throw new Error(data.error || T_ERROR);
                }
            } catch (err) {
                errorDiv.textContent = err.message || T_SERVER_ERROR;
                errorDiv.classList.add('visible');
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 400);

                btn.disabled = false;
                btnText.textContent = T_BTN;
                spinner.classList.remove('visible');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });

    </script>
</body>

</html>

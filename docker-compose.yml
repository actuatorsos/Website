# ══════════════════════════════════════════════════════════════
# Actuators Platform — Docker Compose (Development & DO Droplet)
# Usage: cp .env.example .env && docker compose up -d
# ══════════════════════════════════════════════════════════════

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    command: start --user ${SURREAL_USER:-Actuators} --pass ${SURREAL_PASS:-Actuators123} file:/data/srdb.db
    networks:
      - actuators
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file: .env
    environment:
      SURREAL_URL: surrealdb:8000
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
    depends_on:
      surrealdb:
        condition: service_started
    volumes:
      - uploads_data:/app/static/uploads
    networks:
      - actuators
    restart: unless-stopped

volumes:
  surrealdb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  actuators:
    driver: bridge

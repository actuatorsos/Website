# ══════════════════════════════════════════════════════════════
# Actuators Platform — Digital Ocean App Platform Spec
# Deploy: doctl apps create --spec .do/app.yaml
# ══════════════════════════════════════════════════════════════

name: actuators-platform
region: fra

services:
  - name: app
    github:
      repo: actuatorsos/Website
      branch: platform-v2-erp-complete
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: SURREAL_URL
        value: "${surrealdb.HOSTNAME}:${surrealdb.PORT}"
        scope: RUN_TIME
      - key: SURREAL_USER
        value: Actuators
        scope: RUN_TIME
      - key: SURREAL_PASS
        type: SECRET
        scope: RUN_TIME
      - key: SURREAL_NS
        value: Actuators
        scope: RUN_TIME
      - key: SURREAL_DB
        value: erp
        scope: RUN_TIME
      - key: SERVER_HOST
        value: "0.0.0.0"
        scope: RUN_TIME
      - key: SERVER_PORT
        value: "8080"
        scope: RUN_TIME
      - key: ADMIN_USER
        value: admin@actuators.app
        scope: RUN_TIME
      - key: ADMIN_PASS
        type: SECRET
        scope: RUN_TIME
      - key: JWT_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: JWT_EXPIRY_HOURS
        value: "24"
        scope: RUN_TIME
      - key: OPENROUTER_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: RUST_LOG
        value: info
        scope: RUN_TIME
